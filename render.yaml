services:
  - type: web
    name: elevage-pro
    env: docker
    plan: starter
    preDeployCommand: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: elevage-pro-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_AI_SELECTION_AGENT
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_SELECTION_MODEL
        value: gpt-5-mini

databases:
  - name: elevage-pro-db
    plan: starter
